name: New bot
description: Propose a Grok Bot template for the catalog
title: "Add: "
labels: ["new-bot"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Expense Manager
    validations:
      required: true
  - type: input
    id: share
    attributes:
      label: Share link
      description: Must be a live https://x.ai/bot/… URL
      placeholder: https://x.ai/bot/
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - coding-shipping
        - inbox-calendar
        - research-briefings
        - customer-sales
        - finance-ops
        - content-publishing
        - personal-admin
        - teams-handoffs
    validations:
      required: true
  - type: input
    id: connectors
    attributes:
      label: Connectors
      placeholder: Gmail, Google Drive
    validations:
      required: true
  - type: textarea
    id: first_safe_task
    attributes:
      label: First safe task
      description: Read-only. No send, pay, or delete.
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author GitHub
      placeholder: octocat
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is awesome
      description: One sentence.
    validations:
      required: true
